name: Gateway Perf (Create 50 APIs + TPS)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 20 * * *"   # daily 20:00 UTC (adjust)

jobs:
  perf:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools (JMeter + jq)
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
          # Install JMeter
          JMETER_VER=5.6.3
          curl -L -o apache-jmeter.tgz "https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-${JMETER_VER}.tgz"
          tar -xzf apache-jmeter.tgz
          echo "$PWD/apache-jmeter-${JMETER_VER}/bin" >> $GITHUB_PATH

      - name: Start Gateway (docker compose)
        run: |
          docker compose -f gateway/docker-compose.yaml up -d
          docker ps

      - name: Wait for controller /health
        run: |
          set -euo pipefail

          COMPOSE_FILE="gateway/docker-compose.yaml"
          SVC="gateway-gateway-controller-1"     # change if your service name is different
          PORT="9090"
          URL="http://127.0.0.1:${PORT}/health"

          echo "== compose ps =="
          docker compose -f "$COMPOSE_FILE" ps || true

          echo "Waiting for $URL ..."
          for i in $(seq 1 90); do
            # 1) service container must exist
            cid="$(docker compose -f "$COMPOSE_FILE" ps -q "$SVC" || true)"
            if [[ -z "${cid}" ]]; then
              echo "Attempt $i: service '$SVC' container not found yet"
              sleep 2
              continue
            fi

            # 2) container must be running
            running="$(docker inspect -f '{{.State.Running}}' "$cid" 2>/dev/null || echo false)"
            if [[ "$running" != "true" ]]; then
              echo "Attempt $i: container not running yet"
              docker compose -f "$COMPOSE_FILE" ps || true
              sleep 2
              continue
            fi

            # 3) port must be published
            hostport="$(docker compose -f "$COMPOSE_FILE" port "$SVC" "$PORT" 2>/dev/null | tail -n1 || true)"
            if [[ -z "$hostport" ]]; then
              echo "Attempt $i: port $PORT not published for service '$SVC' (no host mapping)"
              echo "Tip: ensure '$SVC' has ports: - \"9090:9090\" in compose"
              sleep 2
              continue
            fi

            # 4) curl health
            code="$(curl -s -o /dev/null -w "%{http_code}" "$URL" || true)"
            if [[ "$code" == "200" ]]; then
              echo "✅ Healthy!"
              curl -s "$URL" || true
              exit 0
            fi

            echo "Attempt $i: not ready (HTTP $code)"
            sleep 2
          done

          echo "❌ Controller did not become healthy"
          echo "== compose ps =="
          docker compose -f "$COMPOSE_FILE" ps || true
          echo "== last logs =="
          docker compose -f "$COMPOSE_FILE" logs --no-color --tail=200 "$SVC" || true
          exit 1



      - name: Create 50 APIs + collect docker stats CSV
        run: |
          chmod +x perf/create_apis_stats.sh
          # Create 50 APIs and write stats.csv
          perf/create_apis_stats.sh 50 stats.csv
          tail -n 5 stats.csv || true

      - name: Run JMeter TPS test (random across 50 APIs)
        env:
          # Increase file descriptors for high concurrency (best-effort on hosted runners)
          # On hosted runners this may not go very high; for real perf use self-hosted runner.
          JMETER_HEAP: "-Xms1g -Xmx1g"
        run: |
          ulimit -n 100000 || true
          export HEAP="${JMETER_HEAP}"

          # Non-GUI run
          jmeter -n \
            -t perf/weather_perf_random_50.jmx \
            -l perf.jtl \
            -j jmeter.log

          # Optional: quick TPS summary from JTL (prints to job logs)
          # This assumes standard JTL CSV with timeStamp,elapsed,...,success in column 8.
          awk -F',' '
            NR==1{next}
            {count++; if($8=="false")err++; sum+=$2; ts=$1;
             if(min==0||ts<min)min=ts; if(ts>max)max=ts}
            END{
              dur=(max-min)/1000.0;
              tps=(dur>0)?count/dur:0;
              avg=(count>0)?sum/count:0;
              errpct=(count>0)?(err*100.0/count):0;
              printf "Requests=%d Duration=%.1fs TPS=%.2f AvgMs=%.1f ErrPct=%.2f\n", count, dur, tps, avg, errpct
            }' perf.jtl || true

      - name: Docker stats snapshot
        if: always()
        run: |
          docker stats --no-stream || true
          docker compose logs --no-color | tail -n 200 || true

      - name: Upload artifacts (CSV + JTL + logs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-results
          path: |
            stats.csv
            perf.jtl
            jmeter.log
